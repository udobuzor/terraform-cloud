plugin: amazon.aws.aws_ec2
aws_profile: default

regions:
  - "us-east-1"

strict: False

keyed_groups:
  - key: tags
    prefix: tag

filters:
  tag:Name:
    - oddshare-bastion
    - oddshare-nginx
    - oddshare-tooling
    - oddshare-wordpress
  instance-state-name: running

hostnames:
  - private-ip-address
  - tag:Name
  - dns-name
  - ip-address

compose:
  ansible_host: private_ip_address
